<!DOCTYPE html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E2E12" />
    <meta name="description" content="Your rights, constitution and history — in everyday language every Nigerian can understand." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KYN" />

    <!-- Open Graph -->
    <meta property="og:title" content="Know Your Nigeria" />
    <meta property="og:description" content="Your rights, constitution and history — in everyday language." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Know Your Nigeria" />
    <meta name="twitter:description" content="Your rights, constitution and history — in everyday language." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preload splash artwork so the intro never flashes -->
    <link rel="preload" as="image" href="/splash/01.jpg" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MZC6TFWTSK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MZC6TFWTSK');
    </script>

    <title>Know Your Nigeria</title>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* Full-height that follows the real viewport, not the theoretical one */
      :root { --app-h: 100%; }
      @supports (height: 100dvh) { :root { --app-h: 100dvh; } }

      html, body {
        height: var(--app-h);
        width: 100%;
        background: #0E2E12;
        overflow: hidden;
        position: fixed;
        overscroll-behavior: none;
      }
      #root { height: var(--app-h); }

      /* Boot screen — matches the app's forest/lime palette */
      #splash {
        position: fixed; top: 0; left: 0; right: 0;
        height: var(--app-h);
        background: #0E2E12;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.35s ease;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash-flag { font-size: 46px; margin-bottom: 16px; }
      #splash-title { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -0.9px; }
      #splash-sub { font-size: 12.5px; color: rgba(255,255,255,0.5); margin-top: 8px; }
      #splash-bar { width: 92px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.15); margin-top: 20px; overflow: hidden; }
      #splash-bar i { display: block; height: 100%; width: 40%; border-radius: 2px; background: #B4E550; animation: sweep 1.1s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-110%);} 100% { transform: translateX(320%);} }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-flag">🇳🇬</div>
      <div id="splash-title">Know Your Nigeria</div>
      <div id="splash-sub">Loading…</div>
      <div id="splash-bar"><i></i></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Fallback for browsers without dvh support
      (function () {
        if (window.CSS && CSS.supports && CSS.supports('height', '100dvh')) return;
        function setH() {
          var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
          document.documentElement.style.setProperty('--app-h', h + 'px');
        }
        setH();
        window.addEventListener('resize', setH);
        window.addEventListener('orientationchange', setH);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', setH);
      })();

      window.addEventListener('load', function () {
        setTimeout(function () {
          var s = document.getElementById('splash');
          if (s) { s.classList.add('hidden'); setTimeout(function(){ s.remove(); }, 400); }
        }, 400);
      });
    </script>
  </body>
</html>
